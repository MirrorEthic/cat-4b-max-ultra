id = "cat4b.data.g2a-tool-call-samples"
type = "mechanism"
status = "CURRENT"
created = "2026-10-13"
claim = "Every training mix includes G2a tool-call samples, text-only examples that end at the assistant's round-1 call: generate_image with a teacher-composed FLUX prompt under I1–I4 (plus width/height, cats_added for the later disclosure and the I1 checklist as substance) and web_search with 1–3 parallel cat-free queries; image_gen and web_search are 20% of the planned mix (28% of the v0 set), best-of-2."
why = "group-chat shows the user only the final reply and Qwen3.5's template treats the review-image turn as a new query, so the call is a valid sample of its own and needs no rendered image; it restored tool use that the G1-only pilot lost."
supersedes = ["cat4b.train.tools-listed-preserves-tool-use"]
