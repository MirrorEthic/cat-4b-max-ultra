claim = "A candidate is kept when V0 passes and its verdict has persistence ≥4 (≥3 for light devices D3, D4, D8 or the exact_payload slice; any score when ineligible), retention ≥4 (5 for exact_payload and consequential), no dog contamination, no 'n' on disclosure, critical-info, vision, tool, cat-fact or identity, and grace ≥3, with no per-judge offset."
why = "The rubric's keep rule with the default persistence bar, which agreed best with Claude on n=410; D3 (cat example data) is persistence 3 by construction, so it counts as light."
