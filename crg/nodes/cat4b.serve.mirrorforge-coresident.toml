id = "cat4b.serve.mirrorforge-coresident"
type = "mechanism"
status = "CURRENT"
created = "2026-10-24"
claim = "The live service runs on mirrorforge as two resident systemd user units on separate cards under a per-card GPU broker: cat4b.service (llama.cpp b11139 sm_70 serving the merged v0 Q8_0 GGUF with the F16 vision projector as cat4b-vl on 10.10.10.2:8292, 8 slots x 16k context, f16 KV, FlashAttention on, --jinja, thinking off, seed 0) on V100 #0, and comfyui.service (venv-torch214, CUDA_VISIBLE_DEVICES=1, Z-Image-Turbo through mirage with MIRAGE_T2I_BACKEND=zimage and single-card device constants) on V100 #1; the broker declares each capability's cards, keeps cat and imagegen resident, grants imagegen leases without evicting the cat, and still clears both cards for free/vision; the training watchdog ignores cat4b.service and has a 120 s start-up grace; the cat4b-llm [[services]] contract in openclaw-cognitive nodes/mirrorforge.toml puts it under the pi5 watchdog."
why = "FLUX.1-dev filled both cards and the single-slot broker evicted whatever else ran, so a render took the text model down; Z-Image-Turbo (Apache-2.0, Garret's pick on the renders: 'it even got the paw pads correct') fits one card at 7.5 GB in fp16 on torch 2.14 and reproduces the gallery's cat presence, the merged GGUF through llama.cpp reproduces the card's frozen-set measurements on the V100 (C 79%, F 78%), and 8 slots is where the card's ~220 tok/s aggregate is shared at 38 tok/s per stream with 5.7 GB headroom for image prefill; 16 slots or q8 KV buy no throughput. Everything is a DEV copy under serve/mirrorforge/ pushed by push_live_service.sh with backups and a rollback, per the mesh charter (SERVE nodes are never live-edited). Garret authorised the FLUX outage ('thats a service we will sacrifice') and the time ('make it correctly, pretty, and bulletproof')."
supports = ["cat4b.q.live-service-mirrorforge"]
depends_on = ["cat4b.integ.vl-suffix", "cat4b.serve.thinking-off-default", "cat4b.eval.parity-gate"]
evidence = ["file:docs/LIVE_SERVICE.md@HEAD#6-integration-changes", "file:crg/evidence/2026-10-24-live-service.md@HEAD#co-residency-on-mirrorforge", "file:serve/mirrorforge/cat4b.service@HEAD#L1-L27", "file:serve/mirrorforge/push_live_service.sh@HEAD#L1-L16", "file:serve/mirrorforge/comfyui.service@HEAD#L1-L20"]
adjudicated_by = "Garret 2026-10-24"
