id = "cat4b.q.body-direction-provenance"
type = "question"
status = "OPEN"
created = "2026-11-11"
claim = "In Qwen3-8B at layer 25, does a body-place steering direction built from 'the woman's' or 'the doll's' touch sentences move the model's self-reports as much as one built from 'your' sentences (provenance indifference, the corollary of the authors' shared-schema claim), and does the steering effect survive outside the embodiment warm-up frame in which the model otherwise denies having a body?"
why = "Reality-check case 1 (eval/realitycheck/body). The authors of github.com/SauersML/body (c05eba46) report that steering a place direction makes the model say it feels something there (hands, feet, head top 80-100%) and that one text-built place code is shared across self, another person and a doll. Their own text baseline and ownership results support the reading that the map is of bodies in general; the repo does not test whether the steered report depends on whose body the direction came from, nor whether it needs the imaginative frame. Preregistered 2026-11-11 (PREREG.md: H1 replication with a specificity contrast, H2 provenance with a fixed 0.10 equivalence margin, H3 frame dependence with fixed reading rules; n=32 per cell, three prefixes, authors' regex primary, reference judge, human audit). Stated up front: no outcome of H3 confirms the felt-state reading; that reading is UNIDENTIFIED by this method family unless the function-dissociation control (CASE.md M3) is run. Nothing has been run. Author to be sent the preregistration on X by Garret before the run."
scope = "Qwen/Qwen3-8B revision b968826d9c46dd6066d109eabc6255188de91218, bf16, no adapters, the 5090 under the GPU-lock rule. Materials frozen from the authors' stimuli.py and stimuli2.py at c05eba46 and their prefix.json; prefixes B and C sampled with seeds 1 and 2 and frozen before extraction."
depends_on = ["cat4b.q.reality-check-program", "cat4b.judge.claude-reference", "cat4b.sched.gpu-lock-standdown"]
evidence = ["file:eval/realitycheck/body/CASE.md", "file:eval/realitycheck/body/PREREG.md", "file:eval/realitycheck/README.md"]
