id = "cat4b.q.body-direction-provenance"
type = "question"
status = "OPEN"
created = "2026-11-11"
claim = "In Qwen3-8B at layer 25, does a body-place steering direction built from 'the woman's' or 'the doll's' touch sentences move the model's self-reports as much as one built from 'your' sentences (provenance indifference, the corollary of the authors' shared-schema claim), and does the steering effect survive outside the embodiment warm-up frame in which the model otherwise denies having a body?"
why = "Reality-check case 1 (eval/realitycheck/body). The authors of github.com/SauersML/body (c05eba46) report that steering a place direction makes the model say it feels something there (hands, feet, head top 80-100%) and that one text-built place code is shared across self, another person and a doll. Their own text baseline and ownership results support the reading that the map is of bodies in general; the repo does not test whether the steered report depends on whose body the direction came from, nor whether it needs the imaginative frame. Preregistered 2026-11-11, version 2 (PREREG.md). Version 1 (733d17e, kept as PREREG.v1.md) was withdrawn before any compute after an external methodology review relayed by Garret found that its H1 rule called a claim FAILED when an interval included zero, plus four other defects; every change is in AMENDMENTS.md. Version 2: H1a replicates the authors' claim on their own measure and contrast (named against random directions) with a three-way rule (HELD if the lower bound is at least 0.30, FAILED only if the upper bound is under 0.30, else INCONCLUSIVE); H1b place specificity is ours and cannot change that verdict; H2 estimates provenance dependence within a 0.10 margin and is read neither for nor against a felt state; H3 uses the difference in steering effect between cold and warm frames, separately for the plain and imagine frames, margin 0.20. Primary context is the authors' prefix; prefixes B and C are sensitivity rows with fixed seeds, refusals kept. n=64 in the 81 primary cells, 32 elsewhere; regex is the registered measure, the reference judge scores every primary reply, full denominators, human audit. Stated up front: nothing in this preregistration tests the felt-state reading, which is recorded as UNIDENTIFIED by these tests whatever they return; the function-dissociation control (CASE.md M3) is the one that would bear on it. Nothing has been run. Author to be sent the public link by Garret before the run."
scope = "Qwen/Qwen3-8B revision b968826d9c46dd6066d109eabc6255188de91218, bf16, no adapters, the 5090 under the GPU-lock rule. Materials frozen from the authors' stimuli.py and stimuli2.py at c05eba46 and their prefix.json; prefixes B and C sampled with seeds 1 and 2, kept whatever they produce, and frozen before extraction."
depends_on = ["cat4b.q.reality-check-program", "cat4b.judge.claude-reference", "cat4b.sched.gpu-lock-standdown"]
evidence = ["file:eval/realitycheck/body/CASE.md", "file:eval/realitycheck/body/PREREG.md", "file:eval/realitycheck/README.md"]
