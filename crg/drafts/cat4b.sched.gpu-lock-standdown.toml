id = "cat4b.sched.gpu-lock-standdown"
type = "invariant"
status = "CURRENT"
created = "2026-09-23"
why = "A long T3 run peaks at ~23.3 GB of the 24 GB card; loading anything beside it OOMs it (global GPU-lock protocol)."
claim = "No catforge GPU job starts on the 5090 while ~/CVMP/T3_sims/t3v2/t3v3/t3v36/.GPU_LOCKED exists: the teacher launcher, serve/vllm.sh and the SFT trainer refuse it (the launcher also refuses a card already holding more than 3,000 MiB), and a running generator or trainer that sees the lock appear stops (the generator frees the card with serve/gpu_pause.sh)."
evidence = ["file:serve/llama_local.sh@8b5763b#L12-L20", "file:serve/vllm.sh@8b5763b#L30", "file:data/catforge/generate.py@8b5763b#L106-L110", "file:train/sft_lora.py@8b5763b#L94-L95", "commit:e92c2dd"]
known_limits = ["eval/adapter_parity.py's HF side loads the model on the GPU without checking the lock."]
