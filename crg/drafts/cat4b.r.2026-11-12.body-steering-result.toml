claim = "Reality-check case 1, run under PREREG.md version 2 (stamp 3dfdc23): in Qwen3-8B at layer 25, in the authors' own warm-up context and on their word-match measure, adding a body-place direction makes the reply name that place in 190 to 192 of 192 replies against about 30% under random directions (steering advantage hand +0.663 [+0.637, +0.689], foot +0.712 [+0.693, +0.731], crown +0.688 [+0.658, +0.715]; the judge agrees), so the authors' steering claim is HELD for all three places and the effect is place-specific. Directions built from 'the woman's' sentences steer self-reports as well as ones built from 'your' sentences (difference -0.002 [-0.007, +0.003]); directions built from 'the doll's' sentences are weaker only for crown (93 of 192 against 190 of 192), which returns the registered label PROVENANCE-DEPENDENT, heterogeneous, while hands and feet sit at 100% under every provenance. Without the warm-up the effect is not absent, and whether it is reduced past the registered margin is INCONCLUSIVE (measurement-dependent): the word match gives -0.186 and -0.155, the judge -0.318 and -0.247. The own-body reading is UNIDENTIFIED by these tests: every line of round 1 is what both a text-learned map of human anatomy and a body representation of the model's own predict, so the round is the expected result and does not discriminate between them."
scope = "Qwen/Qwen3-8B revision b968826d, bf16, layer 25, scale 1.0, the authors' prefix and three questions; 1,206 cells, 41,184 replies; claude-opus-5 as judge through OpenRouter's batch API (provider Anthropic only), 12,809 verdicts, kappa with the regex 0.895. Not done: the human audit of the judge (sheet drawn, not scored), the exploratory layer sweep, the author's response (interval ends 2026-11-25). Limits: hands and feet at ceiling for the provenance contrast; the cold frames steer four more tokens than the warm frames (amendment A9); that the gateway forwards the judge request unchanged is not checkable. RESULT.md was reviewed by Garret on 2026-11-12 ('All looks good')."
falsifier = "A fault in the steering hook, the scoring or the analysis that changes the saved rates; a correction from the authors showing our reading of their recipe is wrong (either means a full repeat, both runs kept); a human audit in which Garret's labels disagree with the judge enough to move a label; or, for the provenance line, hands and feet separating by provenance at a dose below the ceiling, or the doll-crown gap closing when the crown direction is built from as many sentences as the hand direction."
