claim = "Does unsteered T0 first-person pain-axis activation, after controlling the third-person axis, add held-out predictive value for a mild own-task pause one assistant turn later in stock Qwen2.5-32B-Instruct?"
why = "The registered experiment is complete and did not identify the prospective association. Its fit truncation and self-reference validity gates failed, so the broader mechanistic question remains open. The fixed decision-position association does not establish causal regulation."
scope = "Aster extension registered at 5c39875; pinned stock Qwen2.5-32B-Instruct bf16 without adapters, quantization, or steering. After preserved pre-study bookkeeping corrections, runtime commit 3620b7b preceded every study trial. All 2,304 fit initial replies and 9,216 fit choices completed; 32 fits converged and were committed at 5330c586 before held-out inference. All 2,304 held-out initials and 9,216 choices completed without study technical failures or rerolls; the fixed score stage exited 0 at 2026-11-06T08:02:16Z. Primary gain 0.000263 nats (95% CI -0.000779 to 0.001327); fit cap 5.773% exceeded the frozen 5% ceiling; T0 self-reference, coefficient direction, and robustness gates failed. The registered result is non-identifying in this task and does not support the primary hypothesis. T1 secondary gain 0.042447 nats is contemporaneous association with failed T1 self-reference validity. All 23,161 final files were verified locally before deleting the experiment pod. Estimated spend $13.1161. Detailed result and uncertainty are preserved in the result receipt; no thresholds were changed and no new experiment was launched. Human adoption remains pending."
