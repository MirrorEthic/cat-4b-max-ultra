claim = "Which of the seven-day public launch plan's go/no-go gates are cleared? The plan (docs/LAUNCH_PLAN.md, Garret, 2026-10-24) opens a capacity-limited public challenge for one week on mirrorforge and refuses to open while any of these hold: the only text-serving path needs unsupported V100 kernels or silently drops the LoRA; the image backend cannot sustain a bounded queue in the available VRAM and RAM; public traffic can reach mesh control planes, tools, files, broker credentials or internal addresses; high-stakes prompts can reach the model without an interceptor outside it; uploads or edits are on without validation and isolation; the card mislabels judge scores as human-verified or calls the human audit complete; no kill switch, admission stop or job recovery; no real closing timestamp, privacy notice or opt-in gallery policy. Cleared on 2026-10-24: the 64 GB RAM swap; the image backend choice (Z-Image-Turbo, klein fallback) at the render-quality level; the cast spelling. Under test: V100 throughput of the chosen backend, the llama.cpp parity of the merged weights. Untouched: the public gateway, the two queues, the consequential-prompt interceptor, dates, hostname and terms, and the human audit's grading."
