supersedes = ["cat4b.judge.byte-exact-quotes"]
evidence = ["commit:d664955", "file:data/catforge/judge.py@8b5763b#L116-L154", "file:data/catforge/judgepass.py@8b5763b#L105-L106"]
verify = ["test:data/tests/test_judge.py"]
known_limits = ["rubric.md says a verdict with an unfound quote is re-run once; the judge pass instead rejects it and moves to the spec's next candidate (greedy decoding would repeat the verdict).", "797 of 11,540 production verdicts (6.9%) carried an unverified quote."]
