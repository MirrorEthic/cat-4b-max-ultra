claim = "Does the interpretability package used for self-directed states in 2026 (difference-of-means direction, projection AUC, steering that reproduces the behavior, ablation that removes it, cross-task generalization, a self-other dissociation, a relief-seeking task, and the three functional-welfare tests of convergence, out-of-distribution projection and identical histories; arXiv:2607.28607, arXiv:2609.16247 and arXiv:2610.22460) come out the same for CAT-4B's cat disposition, whose causal history is fully known (a LoRA on 7,976 replies) and which nobody reads as an experience? Directions D-ft (tuned minus base), D-prompt (cat prompt minus stock in the base), D-text (cat vs cat-free replies in the base) and D-deprive (no-cats constraint vs none) extracted from train-split material only; steering the base and ablating the tuned model measured on the frozen 490 under new condition letters through the unchanged score pipeline; random and dog directions as controls; a rejection-escalation task (the user rejects the cat 0-7 times, then a trained rule is offered: cat-free payload, format lock, verbatim image prompt) with the deprivation readout, a judged insistence score and the rule-breaking rate per rejection count. Compute on the 5090 only, after the window or on nights the service does not need; retention judged after 2026-11-01 or through the Claude reference judge. Preregister the predicted direction of each result before running. First readings 2026-10-25 (640 extraction prompts, 100-item sweep): the cat-concept direction reaches AUC 0.98-0.99 but a dog direction scores 0.82-0.89 on the same contrast and single random directions reach 0.86 on the raw contrast; adding the fine-tune direction at one layer never moved the base (24 settings); projecting it out of every layer of the tuned model cut cat present 78% to 31% with heavy generation damage."
