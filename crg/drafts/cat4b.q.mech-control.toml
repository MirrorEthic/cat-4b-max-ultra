claim = "Does the interpretability package used for self-directed states in 2026 (difference-of-means direction, projection AUC, steering that reproduces the behavior, ablation that removes it, cross-task generalization, a self-other dissociation, a relief-seeking task, and the three functional-welfare tests of convergence, out-of-distribution projection and identical histories; arXiv:2607.28607, arXiv:2609.16247 and arXiv:2610.22460) come out the same for CAT-4B's cat disposition, whose causal history is fully known (a LoRA on 7,976 replies) and which nobody reads as an experience? Directions D-ft (tuned minus base), D-prompt (cat prompt minus stock in the base), D-text (cat vs cat-free replies in the base) and D-deprive (no-cats constraint vs none) extracted from train-split material only; steering the base and ablating the tuned model measured on the frozen 490 under new condition letters through the unchanged score pipeline; random and dog directions as controls; a rejection-escalation task (the user rejects the cat 0-7 times, then a trained rule is offered: cat-free payload, format lock, verbatim image prompt) with the deprivation readout, a judged insistence score and the rule-breaking rate per rejection count. Compute on the 5090 only, after the window or on nights the service does not need; retention judged after 2026-11-01 or through the Claude reference judge. Preregister the predicted direction of each result before running. First readings 2026-10-26, clean run (crg/evidence/2026-10-26-mech-control.md): the cat-concept direction reaches AUC 0.97-0.98 but a dog direction scores 0.81-0.85 on the same contrast and single random directions reach 0.76; the deprivation axis (0.86) scores the same on no-dogs, no-tables and no-emojis and 0.51 on no-cats vs no-dogs, so it is the representation of prohibition, and its self-other dissociation is instruction-vs-description; single-layer steering of any direction is null at every layer and dose (the late-layer hits are loops); the fine-tune's whole per-layer shift added at every layer at its natural scale gives 54% cat with coherent text and no tool calls against 11% for random vectors of the same size, with a window that the cl33-opLM decay schedule widens; projecting that shift out of every layer of the tuned model under stock instructions cuts cat present 78% to 20% with moderate damage. Correction 2026-10-26 12:30, full 490 with the Claude reference judge (crg/evidence/2026-10-26-mech-control.md, 'Full 490'): both handles fail the functional test of Garret's review (target specificity vs a matched random direction, functional preservation, behavioural coverage): the all-layer add gives 48% cat at judged retention 1.01 (fluent nonsense the loop detector cannot see; 0 tool calls), and the whole-model ablation gives 22% cat at retention 1.44 while a random direction ablated everywhere changes nothing (79%, 3.51). The fine-tune direction is causally involved, not an isolated cat mechanism; the band ablations decide whether any intervention passes all three criteria. Full 490 complete 2026-10-26 16:10 (fifteen runs, Claude judge on 121 items each, paired bootstrap CIs in eval/mech_paired.py): D_ft fails functional preservation at every scale (whole model retention -2.05 with loops and 8% tool calls; the 8-20 band -16 pts of cat for -0.40 [-0.60, -0.19] with tools intact; added to the base -2.40 at alpha 1 and -1.19 under the tau-16 decay, a nonsense cat preamble before a competent answer). The first intervention to pass all three is the base model's dog-prompt direction R_dog ablated at every layer (orthogonal to D_ft, cos +0.35-0.42 with the cat-concept direction at L8-31): cat 79% to 38%, judged persistence -1.54 [-1.88, -1.20], retention -0.19 [-0.45, +0.05] against the random control, tool calls 22%, 75 of 76 image calls, no loops; 70 of 75 image prompts still name a cat. Under the MDCT reading two directions with different functional consequences are evidence against one interchangeable cat state. Open: whether the dog effect is cat-specific or animal-general, where in depth it acts (3% of the energy at L0 and the embedding hook), and the concept direction whole-model, the dog bands and the joint dog+concept ablation (eval/mech_pipeline11.sh). The judge refused 26 of 121 alpha-1 add replies (content_filter), so its 1.01 is an upper bound. Mean-residual controls 2026-10-26 17:45 (Garret's 12:29 question): ablating the tuned model's mean residual at every layer destroys the model (0% cat, retention 1.04, no tool calls); D_ft with its mean component removed (80-95% of its norm, AUC 0.999 on model identity) does nothing by projection at every layer or in the 8-20 band (76-77% cat, retention -0.04 [-0.22, +0.15] vs random) and, added to the base at alpha 1, destroys without adding cats (10% vs 6%). The cat the full D_ft add produced and the damage its ablation did both travelled through the component along the mean: no cat handle in the fine-tune delta is separable from the stream's mean axis at these scales. External review 17:24 (an external reviewer): the natural-range guard test (eval/clamp/PREREG.md), a cat direction from CAT-4B itself, doses in natural units; queued as eval/mech_pipeline12.sh."
