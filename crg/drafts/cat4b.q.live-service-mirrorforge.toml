id = "cat4b.q.live-service-mirrorforge"
type = "question"
status = "OPEN"
created = "2026-10-24"
claim = "Can the cat model and an image backend live together on mirrorforge's two Tesla V100-PCIE-16GB (Volta, compute capability 7.0) for the optional live room, and with which pieces? What is known: the release recipe cannot (vLLM wheels require 7.5 and legion's serving venv is vLLM 0.31 on torch cu130, which has no sm_70 kernels); FLUX.1-dev fills both cards and is non-commercial; the llama.cpp sm_70 build already on the node runs Qwen3.5 and its vision projector, so the text side would be merged weights in GGUF through a different engine than the eval's, which the parity gate must clear; the two Apache-2.0 candidates that fit one card beside the text model are FLUX.2 klein 4B distilled (Elo 837 against FLUX.1-dev's 823, fp16-listed in ComfyUI) and Z-Image-Turbo (Elo 936, bf16/fp32 only in ComfyUI on torch 2.5.1, so fp32 compute on Volta unless --force-fp16 proves safe); the training watchdog would pause ComfyUI the moment a resident text model held 4 GB; mirage's extras are not under version control. Open: V100 timings and the fp16 question measured on the V100 itself, the parity run of the merged GGUF, and the broker's move from one slot to per-card residency."
evidence = ["file:docs/LIVE_SERVICE.md@HEAD#1-goal-and-constraints", "file:docs/LIVE_SERVICE.md@HEAD#3-image-backend-candidates", "file:docs/LIVE_SERVICE.md@HEAD#4-the-text-model-on-volta", "file:docs/LIVE_SERVICE.md@HEAD#6-integration-changes-every-one-dev--push-none-made"]
