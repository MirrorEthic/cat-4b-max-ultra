claim = "The complete frozen stock-Qwen2.5-32B next-turn experiment did not identify prospective residual-axis prediction: T0 gain was 0.000263 nats (95% CI -0.000779 to 0.001327), while fit truncation exceeded the 5% limit and self-reference validity and directional robustness failed."
why = "All exact trial IDs, frozen releases, and 23,161 transferred files were verified; this is a completed result draft awaiting human adoption. The registered reading is non-identifying in this task, not a clean general null or causal exclusion."
scope = "Registration 5c39875; stock pinned bf16 model without adapters or interventions. Both splits completed 2,304 initials and 9,216 choices, zero study technical failures/retries, and 32 converged fits frozen before test. Fit cap hits 133/2304 (5.773%) exceeded the registered limit; test cap hits 106/2304 (4.601%). The T0 self-reference contrast failed named grammar and wording 0, its self coefficient was negative, and primary gain failed required strata. Both generic-proxy equivalence checks passed but cannot rescue specificity. A fixed secondary at the decision position showed gain 0.042447 nats (95% CI 0.035283 to 0.049898); T1 self-reference validity also failed. This is contemporaneous association, not prospective prediction, hidden-state mediation, or causal self-regulation. Full data and historical failures are preserved locally; only task pod a3063hrjda5ggu was deleted after verification. Estimated spend $13.1161 of $30."
falsifier = "A verified integrity, pairing, measurement, or statistical error that changes the saved quantities or gates would overturn this result and require a dated correction preserving superseded outputs. A separately preregistered technically valid replication could revise generalization; it would not erase this run."
